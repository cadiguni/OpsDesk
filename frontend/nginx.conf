server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # A API atrás da mesma origem do SPA.
    #
    # É o que elimina CORS e cookie entre origens do ambiente local: o navegador vê um
    # endereço só, e o refresh token viaja como cookie de primeira parte. Também é mais
    # parecido com produção, onde Front Door ou Application Gateway ficam na frente dos
    # dois.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O envio de anexo aceita até 10 MB por arquivo; o padrão do nginx é 1 MB e
        # cortaria o upload antes de a API poder responder qual é o limite.
        client_max_body_size 32m;

        # Download de anexo grande não precisa passar pelo buffer em disco do nginx.
        proxy_buffering off;
    }

    # Swagger e health check, para não precisar trocar de porta ao depurar.
    location ~ ^/(swagger|openapi|health) {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Os arquivos com hash no nome podem ser cacheados para sempre; o index.html, nunca —
    # é ele que aponta para o bundle novo depois de um deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rota do SPA: qualquer caminho desconhecido devolve o index, e o React Router resolve.
    # Sem isto, recarregar a página em /chamados/<id> dá 404 do nginx.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
