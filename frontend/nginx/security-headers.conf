# Cabeçalhos de segurança de todas as respostas, inclusive as repassadas da API.
#
# Moram no nginx, e não na borda, porque é o único componente presente em toda forma de
# subir o OpsDesk: atrás do Caddy no compose de produção, atrás do App Service no Azure, e
# sozinho no perfil `web` local. Assim o `npm run build` servido pelo contêiner já roda
# sob a mesma CSP de produção.
#
# `always` faz o cabeçalho sair também em respostas de erro, que o nginx omitiria.
#
# HSTS só tem efeito quando a resposta chega por HTTPS; sobre o HTTP do perfil local o
# navegador o ignora.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Imagens de anexo chegam como blob: gerado no próprio navegador. Script inline é
# bloqueado: o tema é aplicado por public/theme-init.js, e não por <script> no index.html.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
